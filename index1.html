<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>League Scheduler</title>
<style>
  :root {
    --bg: #0f172a;
    --surface: #1e293b;
    --surface-2: #273449;
    --border: #334155;
    --text: #f1f5f9;
    --muted: #94a3b8;
    --primary: #38bdf8;
    --primary-hover: #0ea5e9;
    --accent: #f59e0b;
    --derby: #ef4444;
    --success: #22c55e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
  }
  header {
    background: linear-gradient(135deg, #0f172a, #1e293b);
    padding: 24px 32px;
    border-bottom: 1px solid var(--border);
  }
  h1 { margin: 0 0 6px; font-size: 24px; }
  header p { margin: 0; color: var(--muted); font-size: 14px; }
  main { padding: 24px 32px; max-width: 1200px; margin: 0 auto; }
  .controls {
    display: flex;
    flex-wrap: wrap;
    gap: 12px;
    align-items: center;
    background: var(--surface);
    padding: 16px;
    border-radius: 10px;
    border: 1px solid var(--border);
    margin-bottom: 20px;
  }
  label { font-size: 13px; color: var(--muted); }
  select, input[type="text"] {
    background: var(--surface-2);
    color: var(--text);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 8px 10px;
    font-size: 14px;
  }
  button {
    background: var(--primary);
    color: #0f172a;
    border: none;
    border-radius: 6px;
    padding: 9px 16px;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    transition: background .15s;
  }
  button:hover { background: var(--primary-hover); }
  button:disabled { opacity: .5; cursor: not-allowed; }
  .metrics {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
    gap: 12px;
    margin-bottom: 20px;
  }
  .metric-card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
  }
  .metric-label { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; }
  .metric-value { font-size: 20px; font-weight: 700; margin-top: 4px; }
  .status {
    padding: 12px 16px;
    border-radius: 8px;
    margin-bottom: 16px;
    font-size: 14px;
    display: none;
  }
  .status.show { display: block; }
  .status.error { background: rgba(239,68,68,.15); border: 1px solid var(--derby); color: #fecaca; }
  .status.info  { background: rgba(56,189,248,.1); border: 1px solid var(--primary); color: #bae6fd; }
  .round { margin-bottom: 22px; }
  .round-header {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 8px;
  }
  .round-number {
    background: var(--primary);
    color: #0f172a;
    width: 32px; height: 32px;
    border-radius: 50%;
    display: grid; place-items: center;
    font-weight: 700;
    font-size: 14px;
  }
  .round-title { font-size: 16px; font-weight: 600; }
  .matches {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 10px;
  }
  .match {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
  }
  .match.derby { border-color: var(--derby); background: rgba(239,68,68,.08); }
  .teams { font-size: 14px; font-weight: 500; }
  .vs { color: var(--muted); margin: 0 6px; font-size: 12px; }
  .match-meta { font-size: 11px; color: var(--muted); text-align: right; }
  .derby-badge {
    display: inline-block;
    background: var(--derby);
    color: white;
    font-size: 10px;
    padding: 2px 6px;
    border-radius: 4px;
    margin-left: 6px;
    text-transform: uppercase;
    font-weight: 700;
  }
  .loader {
    text-align: center;
    padding: 60px;
    color: var(--muted);
  }
  .spinner {
    display: inline-block;
    width: 32px; height: 32px;
    border: 3px solid var(--border);
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<header>
  <h1>⚽ League Scheduler</h1>
  <p>Generate and view sports league schedules from your FastAPI backend</p>
</header>

<main>
  <div class="controls">
    <label for="apiUrl">API:</label>
    <input type="text" id="apiUrl" value="http://localhost:8000" style="min-width:220px"/>
    <label for="solver">Solver:</label>
    <select id="solver">
      <option value="csp">CSP</option>
      <option value="hc">Hill Climbing</option>
      <option value="sa">Simulated Annealing</option>
      <option value="greedy">Greedy</option>
    </select>
    <button id="generateBtn">Generate Schedule</button>
  </div>

  <div id="status" class="status"></div>

  <div id="metrics" class="metrics" style="display:none"></div>

  <div id="schedule"></div>
</main>

<script>
  const $ = (id) => document.getElementById(id);
  const statusEl = $("status");
  const metricsEl = $("metrics");
  const scheduleEl = $("schedule");
  const btn = $("generateBtn");

  function showStatus(msg, type = "info") {
    statusEl.textContent = msg;
    statusEl.className = `status show ${type}`;
  }
  function hideStatus() { statusEl.className = "status"; }

  function renderMetrics(metrics, stats) {
    metricsEl.innerHTML = "";
    metricsEl.style.display = "grid";
    const items = [
      ["Total Travel", `${Math.round(metrics.total_travel_km || metrics.travel_distance || 0).toLocaleString()} km`],
      ["Rest Imbalance", (metrics.rest_imbalance ?? "-").toString()],
      ["Derby Conflicts", (metrics.derby_conflicts ?? metrics.blackout_violations ?? 0).toString()],
      ["Execution Time", `${(stats?.execution_time_seconds ?? metrics.execution_time_seconds ?? 0).toFixed(2)}s`],
    ];
    for (const [label, value] of items) {
      const card = document.createElement("div");
      card.className = "metric-card";
      card.innerHTML = `<div class="metric-label">${label}</div><div class="metric-value">${value}</div>`;
      metricsEl.appendChild(card);
    }
  }

  function renderSchedule(schedule) {
    scheduleEl.innerHTML = "";
    const rounds = {};
    for (const m of schedule) {
      const r = m.round_number ?? m.round;
      (rounds[r] = rounds[r] || []).push(m);
    }
    const sortedRounds = Object.keys(rounds).map(Number).sort((a, b) => a - b);
    for (const r of sortedRounds) {
      const wrap = document.createElement("div");
      wrap.className = "round";
      wrap.innerHTML = `
        <div class="round-header">
          <div class="round-number">${r}</div>
          <div class="round-title">Round ${r}</div>
        </div>
        <div class="matches"></div>
      `;
      const matchesDiv = wrap.querySelector(".matches");
      for (const m of rounds[r]) {
        const home = m.home_team_name || m.home || `Team ${m.home_team_id}`;
        const away = m.away_team_name || m.away || `Team ${m.away_team_id}`;
        const dist = m.distance_km ?? m.distance ?? 0;
        const isDerby = m.is_derby;
        const card = document.createElement("div");
        card.className = "match" + (isDerby ? " derby" : "");
        card.innerHTML = `
          <div class="teams">
            ${home}<span class="vs">vs</span>${away}
            ${isDerby ? '<span class="derby-badge">Derby</span>' : ''}
          </div>
          <div class="match-meta">${Math.round(dist)} km</div>
        `;
        matchesDiv.appendChild(card);
      }
      scheduleEl.appendChild(wrap);
    }
  }

  async function generate() {
    const base = $("apiUrl").value.replace(/\/$/, "");
    const solver = $("solver").value;
    const url = `${base}/generate/${solver}/`;

    btn.disabled = true;
    metricsEl.style.display = "none";
    scheduleEl.innerHTML = '<div class="loader"><div class="spinner"></div><p>Generating schedule…</p></div>';
    showStatus(`Calling ${url}…`, "info");

    try {
      const res = await fetch(url, { method: "POST", headers: { "Content-Type": "application/json" } });
      if (!res.ok) throw new Error(`HTTP ${res.status} – ${await res.text()}`);
      const data = await res.json();
      hideStatus();
      const schedule = data.schedule || data.matches || [];
      const metrics = data.metrics || data.run_metrics || {};
      const stats = data.search_statistics || data.search_stats || {};
      renderMetrics(metrics, stats);
      renderSchedule(schedule);
      if (!schedule.length) showStatus("No matches returned.", "error");
    } catch (err) {
      scheduleEl.innerHTML = "";
      showStatus(`Failed: ${err.message}`, "error");
    } finally {
      btn.disabled = false;
    }
  }

  btn.addEventListener("click", generate);
</script>
</body>
</html>
